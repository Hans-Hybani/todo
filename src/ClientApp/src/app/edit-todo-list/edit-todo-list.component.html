<div class="EditTodo">
    <h1>Edit a Todo</h1>
    <div class="TodoListCreateLink">
        <a routerLink="/todo-list">Back</a>
    </div>
    <form [formGroup]="todoForm" (ngSubmit)="onSubmit()">
        <div>
            <label for="title">Title</label>
            <input class="title" id="title" type="text" formControlName="title">
            <p *ngIf="todoForm.get('title')?.invalid && todoForm.get('title')?.touched">
                Please enter a title.
            </p>
        </div>
        <div>
            <label for="dueDate">Due Date</label>
            <input class="duedate" id="dueDate" type="date" formControlName="dueDate">
        </div>
        <div>
            <label for="notes">Description</label>
            <textarea class="description" id="notes" rows="4" formControlName="notes" maxlength="2001"></textarea>
            <p *ngIf="todoForm.get('notes')?.invalid && todoForm.get('notes')?.touched">
                Notes must not exceed 2,000 characters.
            </p>
        </div>
        <button type="submit" [disabled]="todoForm.invalid">Save</button>
        <button class="Cancel" type="button" (click)="onCancel()">Cancel</button>
    </form>
</div>
